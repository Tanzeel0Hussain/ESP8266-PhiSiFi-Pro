name: Build Firmware and Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile ESP8266 firmware
        run: pio run -e nodemcuv2

      - name: Prepare web installer site
        run: |
          mkdir -p site/firmware
          cp -r docs/. site/
          cp .pio/build/nodemcuv2/firmware.bin site/firmware/esp8266-wireless-security-lab.bin

      - name: Upload compiled firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-wireless-security-lab-firmware
          path: .pio/build/nodemcuv2/firmware.bin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
