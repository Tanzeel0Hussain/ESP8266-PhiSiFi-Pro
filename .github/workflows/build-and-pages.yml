name: Build ESP8266 Firmware

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/firmware/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp8266-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile ESP8266 firmware
        run: pio run -e nodemcuv2

      - name: Prepare firmware binary
        run: |
          mkdir -p docs/firmware
          cp .pio/build/nodemcuv2/firmware.bin docs/firmware/esp8266-wireless-security-lab.bin
          cp .pio/build/nodemcuv2/firmware.bin esp8266-wireless-security-lab.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-wireless-security-lab-firmware
          path: esp8266-wireless-security-lab.bin

      - name: Update firmware file used by the web installer
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/firmware/esp8266-wireless-security-lab.bin
          if git diff --cached --quiet; then
            echo "Firmware binary is already current."
          else
            git commit -m "build: update browser-installable firmware [skip ci]"
            git push
          fi

      - name: Update defensive firmware release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## ESP8266 Wireless Security Lab v2.0.0

          This release replaces the previous offensive proof-of-concept with the current defensive firmware.

          ### Current capabilities
          - Passive nearby Wi-Fi scanning
          - SSID and BSSID visibility
          - Channel and RSSI display
          - Advertised security-mode identification
          - Open-network configuration warning
          - Local responsive ESP8266 dashboard
          - Browser installation through ESP Web Tools

          The current firmware does not disconnect clients, impersonate access points, or collect Wi-Fi credentials.
          EOF

          if gh release view esp8266 >/dev/null 2>&1; then
            gh release edit esp8266 \
              --title "ESP8266 Wireless Security Lab v2.0.0" \
              --notes-file release-notes.md \
              --latest
            gh release upload esp8266 esp8266-wireless-security-lab.bin --clobber
          else
            gh release create esp8266 esp8266-wireless-security-lab.bin \
              --title "ESP8266 Wireless Security Lab v2.0.0" \
              --notes-file release-notes.md \
              --latest
          fi
